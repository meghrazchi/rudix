{{- /*
PgBouncer accepts connections only from Rudix application pods (api, mcp, worker pools, beat,
migrate, backup-*), on its `postgres` port; the frontend and the ingress controller never
reach it. The default deny (networkpolicy/default-deny.yaml) covers everything else.
*/ -}}
{{- if and .Values.pgbouncer.enabled .Values.networkPolicy.enabled }}
{{- $clients := without (include "rudix.c1.dataClientComponents" . | fromJsonArray) "pgbouncer" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rudix.c1.policyName" (dict "root" . "name" "pgbouncer") }}
  labels:
    {{- include "rudix.c1.policyLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rudix.selectorLabels" (dict "root" . "component" "pgbouncer") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rudix.c1.releaseSelector" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- toYaml $clients | nindent 18 }}
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
