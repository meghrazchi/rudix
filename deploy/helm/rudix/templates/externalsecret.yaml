{{- /* R08-11: optional External Secrets Operator ExternalSecret (off by default). It writes the
Secret named by secrets.existingSecret, which every pod reads with envFrom. Values files hold
only references (remote keys), never secret values. */ -}}
{{- include "rudix.d1.validate" . -}}
{{- $external := .Values.secrets.externalSecret -}}
{{- if $external.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- /* The component list in _helpers.tpl (S1) has no secret entry; this object is configuration. */}}
  name: {{ printf "%s-secrets" (include "rudix.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "rudix.labels" (dict "root" . "component" "config") | nindent 4 }}
spec:
  refreshInterval: {{ $external.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $external.secretStoreRef.name | quote }}
    kind: {{ $external.secretStoreRef.kind | quote }}
  target:
    name: {{ .Values.secrets.existingSecret | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $external.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
