{{- if .Values.mcp.enabled -}}
{{- $ctx := dict "root" . "component" "mcp" -}}
{{- $mcp := .Values.mcp -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rudix.componentName" $ctx }}
  labels:
    {{- include "rudix.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ int $mcp.replicas }}
  selector:
    matchLabels:
      {{- include "rudix.selectorLabels" $ctx | nindent 6 }}
  {{- include "rudix.c1.rollingStrategy" (dict "root" . "kind" "web") | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "rudix.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with $mcp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rudix.c1.podCommon" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: {{ int $mcp.terminationGracePeriodSeconds }}
      {{- with include "rudix.c1.spread" $ctx | trim }}{{ . | nindent 6 }}{{ end }}
      {{- with include "rudix.c1.scheduling" (dict "values" $mcp) | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: mcp
          image: {{ include "rudix.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.mcp.main", "--transport", "streamable_http"]
          ports:
            - name: http
              containerPort: {{ int $mcp.port }}
              protocol: TCP
          envFrom:
            {{- include "rudix.envFrom" . | nindent 12 }}
          env:
            - name: FEATURE_ENABLE_MCP
              value: "true"
            - name: MCP_TRANSPORT
              value: streamable_http
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_HTTP_PORT
              value: {{ int $mcp.port | quote }}
            - name: MCP_HTTP_PATH
              value: {{ $mcp.path | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ int $mcp.preStopSleepSeconds | quote }}]
          resources:
            {{- toYaml $mcp.resources | nindent 12 }}
          securityContext:
            {{- include "rudix.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "rudix.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "rudix.tmpVolume" . | nindent 8 }}
{{- end }}
