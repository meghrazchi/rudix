{{- if .Values.migrations.enabled -}}
{{- $ctx := dict "root" . "component" "migrate" -}}
{{- $migrations := .Values.migrations -}}
{{- $name := include "rudix.componentName" $ctx -}}
{{- $weight := int $migrations.hookWeight -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "rudix.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ sub $weight 10 | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $key, $value := .Values.config.env }}
  {{ $key }}: {{ include "rudix.envValue" $value }}
  {{- end }}
{{- end }}
