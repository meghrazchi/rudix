# Shared log rotation for every service (json-file, 5 x 10 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    image: ${RUDIX_FRONTEND_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_DEPLOYMENT_ENV: production
      NEXT_PUBLIC_APP_URL: https://getrudix.com
      NEXT_PUBLIC_API_URL: https://api.getrudix.com/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${RUDIX_API_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      API_BASE_URL: https://api.getrudix.com
      FRONTEND_BASE_URL: https://getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
      CORS_ORIGINS: https://getrudix.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    image: ${RUDIX_WORKER_IMAGE}
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    restart: unless-stopped
    # Long grace period so Celery can finish acknowledged (acks_late) tasks.
    stop_grace_period: 120s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      API_BASE_URL: https://api.getrudix.com
      FRONTEND_BASE_URL: https://getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started

  # Exactly one beat instance per deployment. Never scale this service; duplicate beats double-schedule tasks.
  beat:
    image: ${RUDIX_WORKER_IMAGE}
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # The worker image's HEALTHCHECK pings a worker node; beat has none.
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      API_BASE_URL: https://api.getrudix.com
      FRONTEND_BASE_URL: https://getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    profiles: ["mcp"]
    image: ${RUDIX_MCP_IMAGE:-${RUDIX_API_IMAGE}}
    command: python -m app.mcp.main --transport streamable_http
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    env_file:
      - .env
    environment:
      FEATURE_ENABLE_MCP: ${FEATURE_ENABLE_MCP:-true}
      ENVIRONMENT: production
      API_BASE_URL: https://api.getrudix.com
      FRONTEND_BASE_URL: https://getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      MCP_TRANSPORT: streamable_http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8010}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/mcp}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
    ports:
      - "${MCP_HTTP_PORT:-8010}:${MCP_HTTP_PORT:-8010}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os, urllib.request; urllib.request.urlopen(f''http://127.0.0.1:{os.environ.get(''MCP_HTTP_PORT'', ''8010'')}/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    user: "0:0"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      "

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:stable}
    restart: unless-stopped
    logging: *default-logging
    # No host ports: reached by api/worker on the internal network only.
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/3310'"]
      interval: 20s
      timeout: 5s
      retries: 15
      # The first start downloads the signature database, which is slow.
      start_period: 300s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management}
    # Fixed node name: RabbitMQ keys its data directory by node name, which
    # follows the container hostname. Without it a recreated container
    # ignores the existing volume.
    hostname: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    logging: *default-logging
    # requirepass is added only when REDIS_PASSWORD is set, so env files
    # without it keep working (unauthenticated, as before).
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli ping exits 0 on NOAUTH, so require an actual PONG.
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    logging: *default-logging
    environment:
      MARIADB_DATABASE: ${MATOMO_DATABASE_DBNAME}
      MARIADB_USER: ${MATOMO_DATABASE_USERNAME}
      MARIADB_PASSWORD: ${MATOMO_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DATABASE_ROOT_PASSWORD}
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u ${MATOMO_DATABASE_USERNAME} -p${MATOMO_DATABASE_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysqli
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DATABASE_USERNAME}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DATABASE_DBNAME}
      MATOMO_FIRST_SUPERUSER_USERNAME: ${MATOMO_FIRST_SUPERUSER_USERNAME}
      MATOMO_FIRST_SUPERUSER_PASSWORD: ${MATOMO_FIRST_SUPERUSER_PASSWORD}
      MATOMO_FIRST_SUPERUSER_EMAIL: ${MATOMO_FIRST_SUPERUSER_EMAIL}
      MATOMO_INSTALL_FORCE: "1"
    ports:
      - "8081:80"
    volumes:
      - matomo_data:/var/www/html

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  rabbitmq_data:
  clamav_data:
  matomo_db_data:
  matomo_data:
