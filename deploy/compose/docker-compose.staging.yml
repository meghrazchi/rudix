# Shared log rotation for every service (json-file, 5 x 10 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared worker pool definition (R06-04): same image, env, resources, grace period,
# and logging as the 0.5.0 single worker. Each pool adds its command and healthcheck.
x-worker: &worker
  image: ${RUDIX_WORKER_IMAGE}
  restart: unless-stopped
  # Long grace period so Celery can finish acknowledged (acks_late) tasks.
  stop_grace_period: 120s
  logging: *default-logging
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 4g
  env_file:
    - .env
  environment:
    ENTERPRISE_GRAPH_ENABLED: "true"
    ENVIRONMENT: staging
    API_BASE_URL: https://api-staging.getrudix.com
    FRONTEND_BASE_URL: https://staging.getrudix.com
    APP_AUTH_AUTO_PROVISION_USERS: "false"
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    QDRANT_URL: http://qdrant:6333
    MINIO_ENDPOINT: http://minio:9000
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
    REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    MALWARE_SCAN_CLAMAV_HOST: clamav
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USERNAME: ${NEO4J_USERNAME}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    clamav:
      condition: service_started
    neo4j:
      condition: service_healthy
      required: false

services:
  # R08-01: the only service with published ports. Caddy terminates TLS and proxies the app,
  # API (with /mcp*), and optional Matomo hosts to the internal network (docs/10, "Edge
  # proxy, scaling, and environment parity"). deploy_compose_remote.sh and Terraform copy
  # deploy/compose/edge/ to ./edge next to this file.
  edge:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    environment:
      RUDIX_APP_HOST: ${RUDIX_APP_HOST:-staging.getrudix.com}
      RUDIX_API_HOST: ${RUDIX_API_HOST:-api-staging.getrudix.com}
      EDGE_ACME_EMAIL: ${EDGE_ACME_EMAIL:-}
      EDGE_TLS_MODE: ${EDGE_TLS_MODE:-acme}
      EDGE_NOINDEX: ${EDGE_NOINDEX:-true}
      EDGE_MATOMO: ${EDGE_MATOMO:-off}
      RUDIX_MATOMO_HOST: ${RUDIX_MATOMO_HOST:-}
      # Backend MAX_UPLOAD_SIZE_MB (25) plus multipart headroom; raise both together.
      EDGE_MAX_REQUEST_BODY: ${EDGE_MAX_REQUEST_BODY:-26MiB}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8010}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC); harmless when the host firewall blocks UDP.
      - "443:443/udp"
    volumes:
      - ./edge:/etc/caddy:ro
      - edge_data:/data
      - edge_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started

  frontend:
    image: ${RUDIX_FRONTEND_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_DEPLOYMENT_ENV: staging
      NEXT_PUBLIC_APP_URL: https://staging.getrudix.com
      NEXT_PUBLIC_API_URL: https://api-staging.getrudix.com/api/v1
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${RUDIX_API_IMAGE}
    restart: unless-stopped
    # Above UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN + API_SHUTDOWN_DRAIN_SECONDS + margin
    # (contract 5.2.5); raise it together with either setting.
    stop_grace_period: 45s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    env_file:
      - .env
    environment:
      ENTERPRISE_GRAPH_ENABLED: "true"
      ENVIRONMENT: staging
      API_BASE_URL: https://api-staging.getrudix.com
      FRONTEND_BASE_URL: https://staging.getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
      CORS_ORIGINS: https://staging.getrudix.com
      # Only containers on the compose network reach the API once its port is closed;
      # narrow to the edge's address range when the network is shared.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: ${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-20}
      API_SHUTDOWN_DRAIN_SECONDS: ${API_SHUTDOWN_DRAIN_SECONDS:-0}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
      neo4j:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # R06-04: one service per worker pool; queues, concurrency, and pool type come from
  # WORKER_POOL_<NAME>_* settings (python -m app.workers.pools <name>, docs/10).
  # documents.processing, .deletion, .reindex; CPU-bound (OCR, parsing)
  worker-ingest:
    <<: *worker
    command: python -m app.workers.pools ingest
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d ingest@$$HOSTNAME --timeout 10 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # documents.graph; I/O-bound (LLM calls, Neo4j writes)
  worker-graph:
    <<: *worker
    command: python -m app.workers.pools graph
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d graph@$$HOSTNAME --timeout 10 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # connectors.sync; I/O-bound (provider APIs)
  worker-sync:
    <<: *worker
    command: python -m app.workers.pools sync
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d sync@$$HOSTNAME --timeout 10 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # evaluations; isolated so a full evaluation queue never delays uploads
  worker-eval:
    <<: *worker
    command: python -m app.workers.pools eval
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d eval@$$HOSTNAME --timeout 10 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # default, email, agents; runs the dead-letter consumer and queue sampler
  worker-default:
    <<: *worker
    command: python -m app.workers.pools default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d default@$$HOSTNAME --timeout 10 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Exactly one beat instance per deployment. Never scale this service; duplicate beats double-schedule tasks.
  beat:
    image: ${RUDIX_WORKER_IMAGE}
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # The worker image's HEALTHCHECK pings a worker node; beat has none.
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      ENTERPRISE_GRAPH_ENABLED: "true"
      ENVIRONMENT: staging
      API_BASE_URL: https://api-staging.getrudix.com
      FRONTEND_BASE_URL: https://staging.getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    profiles: ["mcp"]
    image: ${RUDIX_MCP_IMAGE:-${RUDIX_API_IMAGE}}
    command: python -m app.mcp.main --transport streamable_http
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    env_file:
      - .env
    environment:
      FEATURE_ENABLE_MCP: ${FEATURE_ENABLE_MCP:-true}
      ENVIRONMENT: staging
      API_BASE_URL: https://api-staging.getrudix.com
      FRONTEND_BASE_URL: https://staging.getrudix.com
      APP_AUTH_AUTO_PROVISION_USERS: "false"
      MCP_TRANSPORT: streamable_http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8010}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/mcp}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MALWARE_SCAN_CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os, urllib.request; urllib.request.urlopen(f''http://127.0.0.1:{os.environ.get(''MCP_HTTP_PORT'', ''8010'')}/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # R08-05: opt-in pooler (profile `pooler`), transaction mode. The application uses it only
  # when the operator points DATABASE_URL at pgbouncer:5432 and sets DB_PGBOUNCER_MODE=true;
  # DATABASE_MIGRATION_URL must keep pointing at postgres:5432 (migrations bypass the pooler).
  # Environment names follow the edoburu/pgbouncer image; pin PGBOUNCER_IMAGE.
  pgbouncer:
    profiles: ["pooler"]
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:latest}
    restart: unless-stopped
    logging: *default-logging
    # No host ports: reached by api/worker on the internal network only.
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LISTEN_PORT: 5432
      POOL_MODE: transaction
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    user: "0:0"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # R08-05: opt-in object versioning on the bucket. Overwritten and deleted objects
      # keep old versions, so storage grows until a lifecycle rule expires them (docs/10).
      MINIO_BUCKET_VERSIONING: ${MINIO_BUCKET_VERSIONING:-false}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      if [ "$${MINIO_BUCKET_VERSIONING}" = "true" ]; then
      mc version enable local/$${MINIO_BUCKET};
      fi;
      "

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:stable}
    restart: unless-stopped
    logging: *default-logging
    # No host ports: reached by api/worker on the internal network only.
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/3310'"]
      interval: 20s
      timeout: 5s
      retries: 15
      # The first start downloads the signature database, which is slow.
      start_period: 300s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management}
    # Fixed node name: RabbitMQ keys its data directory by node name, which
    # follows the container hostname. Without it a recreated container
    # ignores the existing volume.
    hostname: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # consumer_timeout and per-queue Prometheus metrics (R06-03);
      # deploy_compose_remote.sh copies infra/rabbitmq/ to ./rabbitmq next to this file.
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-rudix.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    logging: *default-logging
    # requirepass is added only when REDIS_PASSWORD is set, so env files
    # without it keep working (unauthenticated, as before).
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli ping exits 0 on NOAUTH, so require an actual PONG.
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # R08-05: opt-in cache Redis (profile `redis-split`): evicts least-recently-used keys and
  # keeps nothing on disk. Only cached values belong here (REDIS_CACHE_URL); rate limits,
  # tickets, pub/sub, and cache version keys stay on the noeviction `redis` (REDIS_URL).
  redis-cache:
    profiles: ["redis-split"]
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    logging: *default-logging
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory \"$$REDIS_CACHE_MAXMEMORY\" --maxmemory-policy allkeys-lru $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_MAXMEMORY: ${REDIS_CACHE_MAXMEMORY:-256mb}
    healthcheck:
      # redis-cli ping exits 0 on NOAUTH, so require an actual PONG.
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    # R08-12: defined in staging and production; enabled with COMPOSE_PROFILES=graph.
    profiles: ["graph"]
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    restart: unless-stopped
    logging: *default-logging
    # Bolt (7687) and HTTP browser (7474) are NOT published to the host —
    # internal Docker network only, reached by api/worker via NEO4J_URI.
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  matomo-db:
    # R08-12: defined in staging and production; enabled with COMPOSE_PROFILES=analytics.
    profiles: ["analytics"]
    image: mariadb:11
    restart: unless-stopped
    logging: *default-logging
    environment:
      MARIADB_DATABASE: ${MATOMO_DATABASE_DBNAME:-}
      MARIADB_USER: ${MATOMO_DATABASE_USERNAME:-}
      MARIADB_PASSWORD: ${MATOMO_DATABASE_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DATABASE_ROOT_PASSWORD:-}
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u ${MATOMO_DATABASE_USERNAME:-} -p${MATOMO_DATABASE_PASSWORD:-}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  matomo:
    profiles: ["analytics"]
    image: matomo:5-apache
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysqli
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DATABASE_USERNAME:-}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD:-}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DATABASE_DBNAME:-}
      MATOMO_FIRST_SUPERUSER_USERNAME: ${MATOMO_FIRST_SUPERUSER_USERNAME:-}
      MATOMO_FIRST_SUPERUSER_PASSWORD: ${MATOMO_FIRST_SUPERUSER_PASSWORD:-}
      MATOMO_FIRST_SUPERUSER_EMAIL: ${MATOMO_FIRST_SUPERUSER_EMAIL:-}
      MATOMO_INSTALL_FORCE: "1"
    # No host ports: browsers reach Matomo through the edge (EDGE_MATOMO=on,
    # RUDIX_MATOMO_HOST); the 0.7.0 public port 8081 is closed.
    volumes:
      - matomo_data:/var/www/html

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  rabbitmq_data:
  clamav_data:
  neo4j_data:
  matomo_db_data:
  matomo_data:
  edge_data:
  edge_config:
