# Rudix RabbitMQ settings (R06-03, R06-05). Mounted read-only at
# /etc/rabbitmq/conf.d/20-rudix.conf, next to the image's own 10-defaults.conf.

# Close a consumer that holds an unacknowledged delivery longer than 30 minutes; the message
# is redelivered. Celery acks after the task returns (acks_late), so every task hard time
# limit must stay below this value. Keep CELERY_BROKER_CONSUMER_TIMEOUT_SECONDS equal to it
# (in seconds); workers refuse to start in staging and production when a hard limit is not
# below it.
consumer_timeout = 1800000

# Per-queue metrics on :15692/metrics (rabbitmq_queue_messages_ready{queue=...}); the
# default aggregates all queues into one series.
prometheus.return_per_object_metrics = true
