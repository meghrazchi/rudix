# promtool unit tests (R08-09, B2). CI runs them in the deploy-config job:
#   promtool test rules infra/observability/prometheus/tests/*.yml
# They are not run on a development machine.
rule_files:
- ../rules/beat.yml
evaluation_interval: 1m
tests:
- name: fresh heartbeat raises nothing
  interval: 1m
  input_series:
  - series: rudix_beat_heartbeat_timestamp_seconds{job="rudix-worker", instance="worker-default:9808"}
    values: 0+60x30
  - series: up{job="rudix-worker", instance="worker-default:9808"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: RudixBeatHeartbeatStale
    exp_alerts: []
  - eval_time: 20m
    alertname: RudixBeatHeartbeatMissing
    exp_alerts: []
- name: stopped heartbeat is stale after 5 minutes over the limit
  interval: 1m
  input_series:
  - series: rudix_beat_heartbeat_timestamp_seconds{job="rudix-worker", instance="worker-default:9808"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 8m
    alertname: RudixBeatHeartbeatStale
    exp_alerts: []
  - eval_time: 12m
    alertname: RudixBeatHeartbeatStale
    exp_alerts:
    - exp_labels:
        severity: critical
        service: beat
      exp_annotations:
        summary: Celery beat heartbeat is 12m 0s old
        description: 'No ops.beat.heartbeat ran for more than 5 minutes. Scheduled work (connector polls, usage flush, outbox relay, reapers, retention) is not being enqueued or not executed. Check that exactly one beat runs (logs: ''Scheduler: Sending due task ops-beat-heartbeat'') and that worker-default consumes the default queue.'
        runbook: docs/17_CONNECTOR_OPERATIONS_RUNBOOK.md#scheduled-syncs-never-start
- name: workers up without any heartbeat
  interval: 1m
  input_series:
  - series: up{job="rudix-worker", instance="worker-default:9808"}
    values: 1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: RudixBeatHeartbeatMissing
    exp_alerts: []
  - eval_time: 20m
    alertname: RudixBeatHeartbeatMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        service: beat
      exp_annotations:
        summary: Workers are scraped but no beat heartbeat has ever been exported
        description: Worker targets are up, yet rudix_beat_heartbeat_timestamp_seconds does not exist. Beat is not running, the default pool is not scraped, or METRICS_ENABLED is false on the workers (the heartbeat task records nothing then).
        runbook: docs/17_CONNECTOR_OPERATIONS_RUNBOOK.md#scheduled-syncs-never-start
- name: no worker target up means no missing alert
  interval: 1m
  input_series:
  - series: up{job="rudix-worker", instance="worker-default:9808"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: RudixBeatHeartbeatMissing
    exp_alerts: []
