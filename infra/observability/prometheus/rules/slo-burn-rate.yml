# Multi-window burn-rate alerts (R08-09, B2) on the series of slo-recording.yml.
# Page (critical): the 1h and 5m bad-event ratios both exceed 14.4x the error budget
# (2% of a 30-day budget per hour). Ticket (warning): the 6h and 30m ratios both exceed
# 6x (5% of the budget in 6 hours). Alertmanager routes critical to oncall-pager and
# warning to oncall-ticket (alertmanager/alertmanager.deploy.yml).
groups:
- name: rudix-slo-burn-chat-ttft-p95
  rules:
  - alert: RudixSloChatTtftBurnRatePage
    expr: |-
      slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate1h > (14.4 * 0.05)
      and
      slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate5m > (14.4 * 0.05)
    for: 2m
    labels:
      severity: critical
      service: api
      slo: chat_ttft_p95
    annotations:
      summary: 'SLO chat_ttft_p95: error budget burning at 14.4x (1h and 5m windows)'
      description: 'Target: Chat time to first token, default profile, p95 2.5 s or less. The bad-event ratio over 1h and 5m is above 14.4 x 0.05 (budget = 1 - 0.95). At this rate the 30-day budget is gone in 50.0 hours. Current 1h ratio: {{ $value | humanizePercentage }}.'
      runbook: docs/12_EVALUATION_AND_MONITORING.md#slo-rules-and-burn-rate-alerts-080
  - alert: RudixSloChatTtftBurnRateTicket
    expr: |-
      slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate6h > (6 * 0.05)
      and
      slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate30m > (6 * 0.05)
    for: 15m
    labels:
      severity: warning
      service: api
      slo: chat_ttft_p95
    annotations:
      summary: 'SLO chat_ttft_p95: error budget burning at 6x (6h and 30m windows)'
      description: 'Target: Chat time to first token, default profile, p95 2.5 s or less. The bad-event ratio over 6h and 30m is above 6 x 0.05 (budget = 1 - 0.95). At this rate the 30-day budget is gone in 120.0 hours. Current 6h ratio: {{ $value | humanizePercentage }}.'
      runbook: docs/12_EVALUATION_AND_MONITORING.md#slo-rules-and-burn-rate-alerts-080
