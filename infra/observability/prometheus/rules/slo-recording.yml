- name: rudix-slo-api-availability-monthly
  rules:
  - record: slo:rudix_http_requests:error_ratio_rate5m
    expr: sum(rate(rudix_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(rudix_http_requests_total[5m]))
  - record: slo:rudix_http_requests:error_ratio_rate30m
    expr: sum(rate(rudix_http_requests_total{status_code=~"5.."}[30m])) / sum(rate(rudix_http_requests_total[30m]))
