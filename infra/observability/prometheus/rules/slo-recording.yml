# SLO recording rules (R08-09, B2). Generated from infra/observability/slo_targets.yml:
# one group per target, ratios over the windows 5m, 30m, 1h, 6h, 3d. Latency ratios are
# 1 - (observations at or below an existing bucket boundary / all observations).
# Edit slo_targets.yml and this file together; backend/tests/test_slo_rules.py checks
# that they agree.
groups:
- name: rudix-slo-chat-ttft-p95
  rules:
  - record: slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate5m
    expr: 1 - (sum(rate(rudix_chat_ttft_seconds_bucket{le="2.5"}[5m])) / sum(rate(rudix_chat_ttft_seconds_count[5m])))
  - record: slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate30m
    expr: 1 - (sum(rate(rudix_chat_ttft_seconds_bucket{le="2.5"}[30m])) / sum(rate(rudix_chat_ttft_seconds_count[30m])))
  - record: slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate1h
    expr: 1 - (sum(rate(rudix_chat_ttft_seconds_bucket{le="2.5"}[1h])) / sum(rate(rudix_chat_ttft_seconds_count[1h])))
  - record: slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate6h
    expr: 1 - (sum(rate(rudix_chat_ttft_seconds_bucket{le="2.5"}[6h])) / sum(rate(rudix_chat_ttft_seconds_count[6h])))
  - record: slo:rudix_chat_ttft_seconds:slow_ratio_le2_5_rate3d
    expr: 1 - (sum(rate(rudix_chat_ttft_seconds_bucket{le="2.5"}[3d])) / sum(rate(rudix_chat_ttft_seconds_count[3d])))
- name: rudix-slo-chat-full-answer-p95
  rules:
  - record: slo:rudix_rag_query_duration_seconds:slow_ratio_le15_rate5m
    expr: 1 - (sum(rate(rudix_rag_query_duration_seconds_bucket{le="15.0"}[5m])) / sum(rate(rudix_rag_query_duration_seconds_count[5m])))
  - record: slo:rudix_rag_query_duration_seconds:slow_ratio_le15_rate30m
