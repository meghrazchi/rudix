  - record: slo:rudix_http_request_duration_seconds:read_slow_ratio_le0_5_rate5m
    expr: 1 - (sum(rate(rudix_http_request_duration_seconds_bucket{method="GET", route!~"unmatched|/metrics|/api/v1/(health|ready)|.*(stream|events|ws).*", le="0.5"}[5m])) / sum(rate(rudix_http_request_duration_seconds_count{method="GET", route!~"unmatched|/metrics|/api/v1/(health|ready)|.*(stream|events|ws).*"}[5m])))
  - record: slo:rudix_http_request_duration_seconds:read_slow_ratio_le0_5_rate30m
