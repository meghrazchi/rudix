global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "rudix-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]

  - job_name: "rudix-worker"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["worker:9808"]

  - job_name: "qdrant"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    scrape_interval: 30s
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
