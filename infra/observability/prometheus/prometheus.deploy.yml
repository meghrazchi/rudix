# Prometheus for staging and production Compose (R08-09, B2; contract 5.2.8).
#
# Same as prometheus.yml (rule files included), except:
# - the API and worker jobs send `Authorization: Bearer <token>` read from
#   /etc/prometheus/secrets/metrics_token (the value of METRICS_BEARER_TOKEN; the file is
#   operator-created under infra/observability/secrets/, never committed). Staging and
#   production run with METRICS_REQUIRE_AUTH=true, so /metrics and port 9808 answer 401
#   without it;
# - only the five worker pools are scraped (staging and production have no `worker`).
# Kubernetes uses the chart's ServiceMonitor instead (docs/28 "Metrics and alerting").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "rudix-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: "rudix-worker"
    metrics_path: "/metrics"
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets:
          - "worker-ingest:9808"
          - "worker-graph:9808"
          - "worker-sync:9808"
          - "worker-eval:9808"
          - "worker-default:9808"

  - job_name: "qdrant"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    scrape_interval: 30s
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
