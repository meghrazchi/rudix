name: Security

# No paths filter: these jobs are required checks (docs/14, "Required status checks"),
# and a workflow skipped by a paths filter leaves them pending.
on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "13 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend tooling
        # pip-audit is a dev extra; uv venvs have no pip, so nothing is pip-installed here.
        run: make -C backend install

      - name: Run pip-audit on the locked set
        # Writes the JSON report; findings do not fail this step (the gate decides).
        run: make -C backend audit-report AUDIT_OUTPUT="$GITHUB_WORKSPACE/artifacts/pip-audit.json"

      - name: Upload pip audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pip-audit-report
          path: artifacts/pip-audit.json
          if-no-files-found: ignore

      - name: Security severity gate (pip-audit)
        # pip-audit has no severity field: every finding counts as high unless it
        # has an unexpired entry in ci/security/security_gate_allowlist.json.
        run: python3 ci/scripts/security_severity_gate.py --pip-audit artifacts/pip-audit.json

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Full npm audit report (non-blocking)
        run: |
          mkdir -p ../artifacts
          npm audit --json > ../artifacts/npm-audit.json || true

      - name: Upload npm audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: artifacts/npm-audit.json
          if-no-files-found: ignore

      - name: npm audit (production dependencies, high and critical block)
        # Dev-only tooling advisories are reported in the artifact above but do not
        # block; anything shipped in the runtime image does.
        run: npm audit --omit=dev --audit-level=high

  filesystem-vulnerability-scan:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true
