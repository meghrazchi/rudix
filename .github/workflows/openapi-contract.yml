name: OpenAPI Contract

# OpenAPI contract check (R03-10): frontend/openapi.json must match the
# backend's exported schema, and the generated frontend types must match
# openapi.json. Fix a failure with `cd frontend && npm run api:update-schema`.

on:
  # No `paths` filter: a required check skipped that way stays pending forever.
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  openapi-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend tooling
        run: make -C backend install

      - name: Compare committed OpenAPI schema with the app
        working-directory: backend
        run: .venv/bin/python scripts/export_openapi.py --check ../frontend/openapi.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API types
        working-directory: frontend
        run: npm run api:check
