name: Secret scan

# Gitleaks over git history (R03-08). No paths filter, so the `Secret scan`
# check always reports and can be required on main.
#   pull_request: the commits in the PR (base..head)
#   push:         the pushed range (before..after)
#   schedule:     full history, report only (never fails; review the artifact)
# Config: .gitleaks.toml (default rules plus exact placeholder values only).

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Pinned CLI release and the sha256 of gitleaks_<version>_linux_x64.tar.gz from
  # that release's gitleaks_<version>_checksums.txt. Update both together.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      - name: Select scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          case "${EVENT_NAME}" in
            pull_request)
              log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              exit_code=1
              ;;
            push)
              if [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "${zero_sha}" ] \
                && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
              elif git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}" >/dev/null \
                && [ "$(git rev-parse "origin/${DEFAULT_BRANCH}")" != "${PUSH_AFTER}" ]; then
                # New branch or force push: everything not yet on the default branch.
                log_opts="origin/${DEFAULT_BRANCH}..${PUSH_AFTER}"
              else
                log_opts="-1 ${PUSH_AFTER}"
              fi
              exit_code=1
              ;;
            *)
              # schedule / workflow_dispatch: full history, report only.
              log_opts="--all"
              exit_code=0
              ;;
          esac
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "Scanning: git log ${log_opts} (exit code on findings: ${exit_code})"

      - name: Run gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
          EXIT_CODE: ${{ steps.range.outputs.exit_code }}
        run: |
          mkdir -p artifacts
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="${LOG_OPTS}" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path artifacts/gitleaks-report.json \
            --exit-code "${EXIT_CODE}" \
            .

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json
          if-no-files-found: ignore
